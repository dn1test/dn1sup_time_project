<!DOCTYPE html>
<!-- Светлая тема (как у штатных диалогов SketchUp); CSS — вендоренный Modus Bootstrap, офлайн -->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>DN1C Time Project 2 — статистика</title>
  <link href="assets/modus-bootstrap.min.css" rel="stylesheet">
  <style>
    .bar-col { flex: 1 1 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; height: 100%; min-width: 0; }
    .bar { background: var(--bs-primary); border-radius: 2px 2px 0 0; min-height: 2px; width: 100%; }
    .axis { display: flex; }
    .axis > div { flex: 1 1 0; text-align: center; min-width: 0; overflow: hidden; }
    #daysBody td { vertical-align: middle; }
  </style>
</head>
<body class="p-3">

  <div class="d-flex align-items-center justify-content-between mb-2">
    <h6 class="m-0">DN1C Time Project 2</h6>
    <span class="badge text-bg-secondary" id="status">—</span>
  </div>

  <div class="card mb-2">
    <div class="card-body py-2 px-3">
      <div class="small text-secondary text-truncate" id="file">—</div>
      <div class="d-flex justify-content-between mt-1 small">
        <span>Сегодня: <b id="today">0</b></span>
        <span>Сессия: <b id="session">0</b></span>
        <span>Всего: <b id="total">0</b></span>
      </div>
    </div>
  </div>

  <div class="d-flex gap-2 align-items-center mb-2">
    <button class="btn btn-sm btn-outline-secondary" id="pauseBtn" title="Пауза / продолжить учёт">&#9208; Пауза</button>
    <button class="btn btn-sm btn-outline-secondary" id="folderBtn" title="Показать stats.yaml в папке проекта">&#128193;</button>
  </div>

  <ul class="nav nav-tabs">
    <li class="nav-item"><a class="nav-link active" data-tab="days" href="#">По дням</a></li>
    <li class="nav-item"><a class="nav-link" data-tab="hours" href="#">По часам</a></li>
    <li class="nav-item"><a class="nav-link" data-tab="weekdays" href="#">По дням недели</a></li>
  </ul>

  <div id="tab-days" class="pt-2">
    <table class="table table-sm table-striped small mb-0">
      <thead>
        <tr><th>Дата</th><th>День</th><th style="width:35%"></th><th class="text-end">Время</th></tr>
      </thead>
      <tbody id="daysBody"></tbody>
    </table>
  </div>

  <div id="tab-hours" class="pt-2 d-none">
    <div class="d-flex align-items-end" style="height:110px" id="hoursChart"></div>
    <div class="axis small text-secondary mt-1" id="hoursLabels"></div>
    <div class="small text-secondary mt-1">Часы суток, суммарно за всё время</div>
  </div>

  <div id="tab-weekdays" class="pt-2 d-none">
    <div class="d-flex align-items-end" style="height:110px" id="weekdaysChart"></div>
    <div class="axis small text-secondary mt-1" id="weekdaysLabels"></div>
    <div class="small text-secondary mt-1">Дни недели, суммарно за всё время</div>
  </div>

  <div class="d-flex align-items-center gap-2 mt-3 small">
    <label class="text-secondary text-nowrap" for="idle">Порог бездействия, мин:</label>
    <input type="number" class="form-control form-control-sm" id="idle" min="1" max="240" step="1" style="width:90px">
    <span class="text-secondary">пауза, если ввода нет дольше</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
